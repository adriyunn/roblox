# luau-ci.yml (About Fishing F1 cloud work; Cloud, 2026-10-06)
# The offline gate as CI: on every push and pull request, install the Luau CLI, syntax-check every
# module at -O0/-O1/-O2, run every *_test.luau and *_test.py, the conventions and quick mutation checks,
# fail on CRLF line endings, then type-check every module and the stub with luau-analyze (a hard gate).
# When the GameOne tree moves into git (process/GIT_MIGRATION.md), point ROOT at Phase5_AF and add
# its suites to the same job: tests/wsa/*.luau run the same way (from their own folder).
name: luau-ci
on:
  push:
    paths:
      - "cloud_work/**"
      - ".github/workflows/luau-ci.yml"
  pull_request:
    paths:
      - "cloud_work/**"
      - ".github/workflows/luau-ci.yml"
jobs:
  offline-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the Luau CLI
        run: |
          mkdir -p "$HOME/bin"
          PREFIX="$HOME/bin" bash cloud_work/tools/setup_luau.sh
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline gate (compile, suites, python tests, line endings)
        run: bash cloud_work/tests/run_all.sh
      - name: Type check (luau-analyze on every module and the stub; any reported error fails the build)
        run: |
          fail=0
          while IFS= read -r f; do
            if out="$(luau-analyze "$f" 2>&1)" && [ -z "$out" ]; then
              echo "  ok   $f"
            else
              echo "  FAIL $f"; printf '%s\n' "$out" | sed 's/^/      /'; fail=$((fail+1))
            fi
          done < <({ find cloud_work/src -type f \( -name '*.lua' -o -name '*.luau' \); echo cloud_work/tests/RobloxStub.luau; } | sort)
          if [ "$fail" -ne 0 ]; then echo "luau-analyze: FAIL $fail file(s)"; exit 1; fi
          echo "luau-analyze: PASS"
